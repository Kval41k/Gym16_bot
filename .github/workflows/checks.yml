name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python scripts/check_all.py
      - run: python -m compileall -q main.py bot.py storage.py offsite_backup.py database.py migrations
      - run: npx --yes pnpm@11.25.0 install --frozen-lockfile
      - run: npx --yes pnpm@11.25.0 run build:css && git diff --exit-code -- static/ui.css
      - run: pip install pip-audit && pip-audit -r requirements.lock.txt --no-deps --disable-pip
      - run: npx --yes pnpm@11.25.0 audit
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gym16_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tests/check_postgres.py
        env:
          GYM16_POSTGRES_TEST_ADMIN_URL: postgresql://gym16_test:disposable_test_password@localhost:5432/postgres
